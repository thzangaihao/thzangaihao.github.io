<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋白质结构查看器 - 海钊知识港</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/molstar@4.11.0/build/viewer/molstar.css"
          onerror="this.onerror=null; this.href='vendor/molstar/4.11.0/molstar.css';">
    <script src="../../../js/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/molstar@4.11.0/build/viewer/molstar.js"
            onerror="this.onerror=null; this.src='vendor/molstar/4.11.0/molstar.js';"></script>
    <script>window.footerPath = '../../../footer.html';</script>
    <style>
        .structure-viewer-shell {
            position: relative;
            width: 100%;
            height: calc(100vh - 70px);
            min-height: 680px;
            overflow: hidden;
            background: #fff;
            color-scheme: only light;
        }
        #molstarViewer { position: absolute; inset: 0; }
        #molstarViewer .msp-layout-expanded { z-index: 10000; }
    </style>
</head>
<body class="structure-viewer-page">
    <nav>
        <div class="logo"><a href="../../../index.html">海钊知识港</a></div>
        <div class="nav-links">
            <a href="../../wet_lab/wet_lab_index.html"><i class="fas fa-flask"></i> 湿实验</a>
            <a href="../../dry_lab/dry_lab_index.html"><i class="fas fa-code"></i> 干实验</a>
            <a href="../resources_index.html" class="active"><i class="fas fa-book"></i> 资源站</a>
            <a href="../../about/about_index.html"><i class="fas fa-user"></i> 关于我</a>
        </div>
    </nav>
    <main class="structure-viewer-shell">
        <div id="molstarViewer" aria-label="Mol* 蛋白质三维结构查看器"></div>
    </main>
    <div id="footer-placeholder"></div>
    <script>
        window.addEventListener("DOMContentLoaded", async () => {
            if (!window.molstar?.Viewer) return console.error("Mol* failed to load.");
            try {
                const viewer = await window.molstar.Viewer.create("molstarViewer", { layoutIsExpanded: false });
                collapseInitialCards();
                requestAnimationFrame(() => removeEmptyMeasurementsGroup(viewer));
            } catch (error) {
                console.error("Mol* failed to initialize.", error);
            }
        });

        function collapseInitialCards() {
            const host = document.getElementById("molstarViewer");
            const initialized = new WeakSet();
            const collapse = () => {
                host.querySelectorAll(".msp-transform-wrapper").forEach(card => {
                    if (initialized.has(card)) return;
                    const headerButton = card.querySelector(":scope > .msp-transform-header > button");
                    if (!headerButton) return;
                    initialized.add(card);
                    if (!card.classList.contains("msp-transform-wrapper-collapsed")) headerButton.click();
                });
            };
            collapse();
            new MutationObserver(collapse).observe(host, { childList: true, subtree: true });
        }

        async function removeEmptyMeasurementsGroup(viewer) {
            const state = viewer.plugin.state.data;
            const emptyGroups = [];

            state.cells.forEach((cell, ref) => {
                const isMeasurementsGroup = cell.obj?.label === "Measurements";
                const hasChildren = (state.tree.children.get(ref)?.size || 0) > 0;
                if (isMeasurementsGroup && !hasChildren) emptyGroups.push(ref);
            });

            if (!emptyGroups.length) return;
            const update = state.build();
            emptyGroups.forEach(ref => update.delete(ref));
            await update.commit();
        }
    </script>
</body>
</html>
